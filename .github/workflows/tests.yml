# The test suites of tools/ (audit of 2026-11-10, findings T1 to T4 and T6: until then no workflow ran
# a test suite on pushes to main, and 12 of 14 Python suites ran nowhere).
#
# fast  on every push (main included) and every pull request, about 2 minutes: the frame tests on the
#       fixed fixture table, the invariants of the live frame (regeneration byte for byte, no lookup
#       worse than at the base commit, a stair step, ids that exist), the meta-test that no test pins a
#       value of the live table, and the quick suites of the submission, credit and upgrade tools.
# slow  nightly, on pushes to main and by hand, one job per suite in parallel, up to about 20 minutes
#       each: the end-to-end routes (upgrades, constructions), the certificate checkers with their
#       mutants, and table/derived.csv regenerated byte for byte.
#
# Nothing here writes to the repository. consistency.yml (pull requests and branches) and
# table-page.yml (main) are unchanged; this file only adds tests.
#
# Tests never assert a size of the live table/: those that need a real table read
# tools/tests_frame/fixtures (a fixed copy), so new rows cannot turn this red
# (tools/tests_frame/test_no_live_pins.py checks that).

name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"      # nightly, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A branch or pull request keeps only its newest run. On main every push gets its own group (the commit is
# part of the name), so no run on main is cancelled or replaced while pending.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the invariants compare the frame with the frame at the base commit
      - name: Base commit for the frame comparison
        # a pull request: where it branched from its base; a push: the commit before the push
        # (the first parent when GitHub gives none, as for a new branch)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base HEAD "$PR_BASE" 2>/dev/null || echo "$PR_BASE")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          echo "FRAME_BASE=$base" >> "$GITHUB_ENV"
          echo "comparing the frame with ${base:-the first parent}"
      - name: No test pins a value of the live table
        run: python3 tools/tests_frame/test_no_live_pins.py
      - name: Frame tests (fixture table)
        run: python3 tools/tests_frame/test_build_frame.py
      - name: Frame invariants (live table)
        run: python3 tools/tests_frame/test_frame_invariants.py
      - name: Above a size rule (CONVENTIONS 1.4)
        run: python3 tools/tests_submission/test_above_rule.py
      - name: Credit tools
        run: |
          python3 tools/tests_credit/test_credit_check.py
          python3 tools/tests_credit/test_credit_text.py
          python3 tools/tests_credit/test_correct_credit.py
      - name: Automatic upgrade requests
        run: python3 tools/tests_upgrade/test_auto_upgrade.py
      - name: Construction kinds
        run: python3 tools/tests_construction/test_kinds.py
      - name: Self-test of the submission check
        run: python3 tools/check_submission.py --selftest --table-dir table > /dev/null

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: upgrades end to end
            run: python3 tools/tests_upgrade/test_upgrades.py
          - name: construction route end to end
            run: python3 tools/tests_construction/test_route.py
          - name: powercz-2 checker and mutants
            run: python3 tools/tests_construction/test_powercz2.py
          - name: construction certificates and mutants
            run: python3 tools/tests_construction/test_construction_cert.py
          - name: stored construction certificates
            run: python3 tools/tests_construction/test_real_certs.py
          - name: Shokri-Moura-Stevens certificates and mutants
            # test_sms.py and the sms scripts use numpy (update first: the runner's package index can be stale)
            run: |
              sudo apt-get update -q > /dev/null
              sudo apt-get install -y -q python3-numpy > /dev/null
              python3 tools/tests_construction/test_sms.py
          - name: Shokri-Moura x-plication certificates and mutants
            # test_smx.py and tools/sm_xplication.py use numpy (update first: the package index can be stale)
            run: |
              sudo apt-get update -q > /dev/null
              sudo apt-get install -y -q python3-numpy > /dev/null
              python3 tools/tests_construction/test_smx.py
          - name: CPHF certificates
            run: python3 tools/cphf/tests/test_certificates.py
          - name: CPHF shards
            run: python3 tools/cphf/tests/test_shards.py
          - name: CPHF fast progression (quick)
            run: python3 tools/cphf/tests/test_fastprog.py --quick
          - name: derived.csv and frame regenerate byte for byte
            # the frame is compared with main as it was a day ago, so that the bot's commits (which start
            # no workflow) are covered too
            run: |
              base=$(git rev-list -1 --before="26 hours ago" HEAD)
              python3 tools/tests_frame/test_frame_invariants.py --slow ${base:+--base "$base"}
    name: slow (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ${{ matrix.suite.name }}
        run: ${{ matrix.suite.run }}
